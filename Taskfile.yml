version: '3'

dotenv: ['.env']

vars:
  GIT_SHA:
    sh: git -C {{.ROOT_DIR}} rev-parse --short HEAD 2>/dev/null || echo dev
  IMAGE: '{{.IMAGE | default "ghcr.io/freema/drobek"}}'
  WEB_URL: 'http://localhost:{{.WEB_PUBLISH | default "3041"}}'

tasks:
  dev:
    desc: Build + start the dev stack (drobek + postgres + redis + mailpit) and wait until healthy
    env:
      GIT_SHA: '{{.GIT_SHA}}'
    cmds:
      - docker compose up -d --build --wait --wait-timeout 300
      - task: health

  up:
    desc: Alias of `task dev`
    cmds:
      - task: dev

  down:
    desc: Stop the dev stack
    cmds:
      - docker compose down

  stop:
    desc: Alias of `task down`
    cmds:
      - task: down

  logs:
    desc: Tail the drobek service logs
    cmds:
      - docker compose logs -f drobek

  status:
    desc: Container status
    cmds:
      - docker compose ps

  shell:
    desc: Shell into the running drobek container
    cmds:
      - docker compose exec drobek sh

  build:
    desc: 'Build the production image ({{.IMAGE}}:<sha>, host platform — releases are linux/amd64); on a release tag checkout VERSION = the tag (vX.Y.Z) → /api/version'
    vars:
      VERSION:
        sh: git -C {{.ROOT_DIR}} describe --tags --exact-match --match 'v*' 2>/dev/null || echo dev
    cmds:
      - >-
        docker build --target runner
        --build-arg GIT_SHA={{.GIT_SHA}} --build-arg VERSION={{.VERSION}}
        -t {{.IMAGE}}:{{.GIT_SHA}} -t {{.IMAGE}}:local .

  test:
    desc: Unit tests (all packages + the server)
    cmds:
      - pnpm build:packages
      - pnpm test

  lint:
    desc: Lint
    cmds:
      - pnpm lint

  doc-lint:
    desc: 'Docs gate (scripts/doc-lint.mjs): retired vocabulary outside docs/archive + CHANGELOG, README quickstart == SELF-HOSTING quickstart, every .env*.example key documented'
    cmds:
      - pnpm doc-lint

  typecheck:
    desc: Typecheck every workspace package
    cmds:
      - pnpm build:packages
      - pnpm typecheck

  knip:
    desc: 'Dead-code gate (knip.ts): unused files, exports, types and dependencies across the workspace — 0 findings'
    cmds:
      - pnpm knip

  check:
    desc: Host-side gate — install, doc-lint, build packages + the server app bundle, typecheck, lint, knip, unit tests
    cmds:
      - pnpm install
      - pnpm doc-lint
      - pnpm build:packages
      - pnpm --filter server build
      - pnpm typecheck
      - pnpm lint
      - pnpm knip
      - pnpm test

  db:generate:
    desc: Generate Drizzle migrations from packages/db schema (journal __drizzle_migrations_core)
    cmds:
      - docker compose exec drobek pnpm --filter @drobek/db db:generate

  db:migrate:
    desc: Apply core Drizzle migrations (also runs automatically when the server starts)
    cmds:
      - docker compose exec drobek pnpm --filter @drobek/db db:migrate

  e2e:
    desc: Playwright suite against the local compose stack (includes @local specs)
    env:
      BASE_URL_WEB: '{{.WEB_URL}}'
      BASE_URL_MCP: '{{.WEB_URL}}'
      TEST_ENV: local
      DATABASE_URL: 'postgresql://drobek:drobek@localhost:{{.POSTGRES_PUBLISH | default "5441"}}/drobek'
      REDIS_URL: 'redis://localhost:{{.REDIS_PUBLISH | default "6391"}}'
      MAILPIT_URL: 'http://localhost:{{.MAILPIT_PUBLISH | default "8025"}}'
      ALLOW_DESTRUCTIVE: '1'
    cmds:
      - pnpm -C tests-e2e exec playwright test {{.CLI_ARGS}}

  e2e:image:
    desc: 'The CI e2e flow locally: build the prod image, run it behind Caddy (tls internal) next to the dev stack, whole @smoke + @local suite [DROBEK_IMAGE=… skips the build; E2E_KEEP=1 keeps the stack]'
    cmds:
      - '{{if not .DROBEK_IMAGE}}docker build --target runner --build-arg GIT_SHA={{.GIT_SHA}} -t {{.IMAGE}}:e2e .{{else}}true{{end}}'
      - DROBEK_IMAGE={{.DROBEK_IMAGE | default (printf "%s:e2e" .IMAGE)}} ./scripts/e2e-image.sh {{.CLI_ARGS}}

  api-key:create:
    desc: 'Create a drk_ API key for a user in the local dev DB and print it once (EMAIL=… [NAME=cli] [SCOPES=read,write] [CREATE_USER=1] creates a user that never signed in)'
    requires:
      vars: [EMAIL]
    cmds:
      - >-
        docker compose exec -T drobek node packages/oauth/dist/cli/api-key-create.js
        --email '{{.EMAIL}}' --name '{{.NAME | default "cli"}}' --scopes '{{.SCOPES | default "read,write"}}'{{if .CREATE_USER}} --create-user{{end}}

  e2e:smoke:
    desc: '@smoke specs only — safe against any target (BASE_URL_WEB=https://… SMOKE_API_KEY=drk_… for production; never touches DB/Redis/Mailpit)'
    env:
      BASE_URL_WEB: '{{.BASE_URL_WEB | default .WEB_URL}}'
      BASE_URL_MCP: '{{.BASE_URL_MCP | default .BASE_URL_WEB | default .WEB_URL}}'
    cmds:
      - pnpm -C tests-e2e exec playwright test --grep "@smoke"

  eval:
    desc: 'MANUAL agent eval (NSO-308, never CI): clean `claude -p` sessions with only the drobek MCP build 3 reference apps against the local stack; results in tests-eval/results/ [-- --dry-run | --self-check | --only a,b,c | --mode plugin]'
    cmds:
      - node tests-eval/run.mjs {{.CLI_ARGS}}

  prod:proof:
    desc: Build the production image and prove it boots, serves and fails closed (scripts/prod-proof.sh)
    cmds:
      - task: build
      - IMAGE={{.IMAGE}}:{{.GIT_SHA}} ./scripts/prod-proof.sh

  mock:google:
    desc: Run the mock Google OIDC provider in the foreground (U3 — tests-e2e/mock-google.mjs, port 3049)
    env:
      MOCK_GOOGLE_PORT: '{{.MOCK_GOOGLE_PORT | default "3049"}}'
    cmds:
      - node tests-e2e/mock-google.mjs

  # ── TLS / Caddy (M0-07) — see docs/SELF-HOSTING.md ─────────────────────────
  caddy:config:
    desc: 'Generate the Caddyfile from .env (PUBLIC_APP_URL, APPS_DOMAIN, TLS_*) → deployments/Caddyfile [OUT=path]'
    cmds:
      - test -f packages/core/dist/cli/caddy-config.js || pnpm --filter @drobek/core build
      - node packages/core/dist/cli/caddy-config.js --out '{{.OUT | default "deployments/Caddyfile"}}'

  tls:reload:
    desc: 'Make the running Caddy re-read its config AND certificate files (after renewing the wildcard cert) — the production stack, or [COMPOSE_ARGS="-f …"]'
    cmds:
      - >-
        {{if .COMPOSE_ARGS}}docker compose {{.COMPOSE_ARGS}}{{else}}./scripts/selfhost-compose.sh{{end}}
        exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile --force

  # ── Self-host (M4-03) — docs/SELF-HOSTING.md ──────────────────────────────
  # Every task below drives docker-compose.production.yaml with
  # --env-file .env.production (ENV_FILE=… overrides; COMPOSE_PROJECT_NAME is
  # honoured). None needs Node on the host.
  selfhost:init:
    desc: 'Create/complete .env.production (secrets via openssl, idempotent) + render deployments/Caddyfile [DOMAIN=… APPS_DOMAIN=… TLS_MODE=on-demand|internal|wildcard-file|dns HTTPS_PORT=…]'
    env:
      DOMAIN: '{{.DOMAIN}}'
      APPS_DOMAIN: '{{.APPS_DOMAIN}}'
      TLS_MODE: '{{.TLS_MODE}}'
      HTTPS_PORT: '{{.HTTPS_PORT}}'
      HTTP_PORT: '{{.HTTP_PORT}}'
      PUBLISH_IP: '{{.PUBLISH_IP}}'
      TLS_ACME_EMAIL: '{{.TLS_ACME_EMAIL}}'
      DROBEK_IMAGE_TAG: '{{.DROBEK_IMAGE_TAG}}'
      SMTP_HOST: '{{.SMTP_HOST}}'
      SMTP_PORT: '{{.SMTP_PORT}}'
      SMTP_SECURE: '{{.SMTP_SECURE}}'
      SMTP_USER: '{{.SMTP_USER}}'
      SMTP_PASS: '{{.SMTP_PASS}}'
      EMAIL_FROM: '{{.EMAIL_FROM}}'
      SUPERADMIN_EMAIL: '{{.SUPERADMIN_EMAIL}}'
    cmds:
      - ./scripts/selfhost-init.sh

  selfhost:migrate:
    desc: 'Apply every pending migration (core + DROBEK_MODULES) with the configured image and exit — the upgrade step; postgres must be up'
    cmds:
      - ./scripts/selfhost-compose.sh run --rm --no-deps -T drobek node dist/server/migrate.js

  selfhost:upgrade:
    desc: 'Upgrade in place: task backup → pull → stop drobek → migrate ×2 → up -d --wait (set DROBEK_IMAGE_TAG in .env.production first to pin a release)'
    vars:
      DC: ./scripts/selfhost-compose.sh
    cmds:
      - task: backup
      - '{{.DC}} pull --ignore-buildable'
      # The stock Caddy is pulled; a DNS-01 Caddy (CADDY_BUILD_TARGET=dns) is rebuilt on the newest base.
      - >-
        if grep -q '^CADDY_BUILD_TARGET=dns' {{.ENV_FILE | default ".env.production"}};
        then {{.DC}} build --pull caddy; else {{.DC}} pull caddy; fi
      - '{{.DC}} up -d --wait postgres redis'
      - '{{.DC}} stop drobek'
      - task: selfhost:migrate
      - task: selfhost:migrate
      - '{{.DC}} up -d --wait --wait-timeout 300'
      - '{{.DC}} exec -T drobek wget -q -O - http://127.0.0.1:3000/api/version && echo'

  backup:
    desc: 'Back up the production stack → backups/drobek-<UTC>.tar.gz (pg_dump -Fc + files_data + assets_data + modules_data + caddy_data + manifest.json) [BACKUP_DIR=backups]'
    cmds:
      - ./scripts/selfhost-backup.sh

  restore:
    desc: 'Restore a `task backup` archive into this stack and start it (refuses a non-empty database unless FORCE=1) — BACKUP=backups/drobek-<ts>.tar.gz'
    requires:
      vars: [BACKUP]
    env:
      BACKUP: '{{.BACKUP}}'
      FORCE: '{{.FORCE}}'
      ALLOW_KEY_MISMATCH: '{{.ALLOW_KEY_MISMATCH}}'
    cmds:
      - ./scripts/selfhost-restore.sh

  selfhost:rehearsal:
    desc: 'The quickstart + backup → restore end to end on throwaway stacks (builds the image; NOT in check/CI) — scripts/selfhost-rehearsal.sh'
    cmds:
      - ./scripts/selfhost-rehearsal.sh

  dev:tls:
    desc: 'Dev stack behind Caddy with `tls internal` → https://localhost + https://<slug>--preview.apps.localhost [DEV_TLS_PORT=443]'
    vars:
      DEV_TLS_PORT: '{{.DEV_TLS_PORT | default "443"}}'
      DEV_TLS_SUFFIX: '{{if eq .DEV_TLS_PORT "443"}}{{else}}:{{.DEV_TLS_PORT}}{{end}}'
    env:
      GIT_SHA: '{{.GIT_SHA}}'
      DEV_TLS_PORT: '{{.DEV_TLS_PORT}}'
      DEV_TLS_SUFFIX: '{{.DEV_TLS_SUFFIX}}'
    cmds:
      - test -f packages/core/dist/cli/caddy-config.js || pnpm --filter @drobek/core build
      - >-
        env -i PATH="$PATH" PUBLIC_APP_URL='https://localhost{{.DEV_TLS_SUFFIX}}'
        APPS_DOMAIN='apps.localhost{{.DEV_TLS_SUFFIX}}' TLS_INTERNAL=1
        node packages/core/dist/cli/caddy-config.js --out .caddy/Caddyfile.dev
      - docker compose -f docker-compose.yml -f docker-compose.tls.yaml up -d --build --wait --wait-timeout 300
      - task: dev:tls:ca
      - echo "dashboard https://localhost{{.DEV_TLS_SUFFIX}}  ·  apps https://<slug>--preview.apps.localhost{{.DEV_TLS_SUFFIX}}  ·  CA .caddy/root.crt"

  dev:tls:ca:
    desc: "Copy Caddy's local root CA to .caddy/root.crt (curl --cacert .caddy/root.crt …; the host trust store is never touched)"
    cmds:
      - mkdir -p .caddy
      - >-
        for i in $(seq 1 20); do
        docker compose -f docker-compose.yml -f docker-compose.tls.yaml exec -T caddy
        test -f /data/caddy/pki/authorities/local/root.crt && break; sleep 0.5; done
      - docker compose -f docker-compose.yml -f docker-compose.tls.yaml cp caddy:/data/caddy/pki/authorities/local/root.crt .caddy/root.crt

  dev:tls:down:
    desc: Remove the dev Caddy and put drobek back on the plain HTTP dev config (`task up`)
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.tls.yaml rm -sf caddy
      - task: dev

  health:
    desc: Curl the health endpoints from the host
    cmds:
      - curl -sf {{.WEB_URL}}/healthz && echo
      - curl -sf {{.WEB_URL}}/health && echo
