# e2e against the production image, driven only by scripts/e2e-image.sh
# (`task e2e:image` and the CI `e2e` job). The production topology in
# miniature: the runner image behind Caddy with `tls internal`, plus throwaway
# postgres / redis / mailpit and the proxy-echo e2e helper.
#
#   https://localhost:${E2E_TLS_PORT}                      dashboard / OAuth / MCP
#   https://<slug>--preview.apps.localhost:${E2E_TLS_PORT} app hosts
#
# Project `drobek-e2e`, no container_name and its own host ports, so it runs
# next to the dev stack. Every published port binds 127.0.0.1 only; the
# secrets are generated per run by the script.
name: drobek-e2e

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: drobek
      POSTGRES_PASSWORD: drobek
      POSTGRES_DB: drobek
    ports:
      - '127.0.0.1:${E2E_POSTGRES_PORT:-5451}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U drobek -d drobek']
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:${E2E_REDIS_PORT:-6401}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit
    ports:
      - '127.0.0.1:${E2E_MAILPIT_PORT:-8035}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 5s
      retries: 30

  proxy-echo:
    # The in-network echo target + CIMD mock documents (tests-e2e/proxy-echo.mjs).
    image: node:22-alpine
    command: ['node', '/e2e/proxy-echo.mjs']
    environment:
      PORT: '8099'
      # Upstreams may only use ports 80/443: the proxy e2e uses port 80.
      EXTRA_PORTS: '80'
      # The fake limits provider checks drobek's signature with it.
      LIMITS_PROVIDER_SECRET: ${LIMITS_PROVIDER_SECRET:?generated by scripts/e2e-image.sh}
    volumes:
      - ./tests-e2e:/e2e:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -T 3 -O - http://127.0.0.1:8099/health || exit 1']
      interval: 2s
      timeout: 5s
      retries: 30

  drobek:
    image: ${DROBEK_IMAGE:?set DROBEK_IMAGE (scripts/e2e-image.sh does)}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://drobek:drobek@postgres:5432/drobek
      REDIS_URL: redis://redis:6379
      PORT: '3000'
      DROBEK_MASTER_KEY: ${DROBEK_MASTER_KEY:?generated by scripts/e2e-image.sh}
      TLS_ASK_TOKEN: ${TLS_ASK_TOKEN:?generated by scripts/e2e-image.sh}
      PUBLIC_APP_URL: https://localhost:${E2E_TLS_PORT:-8443}
      PUBLIC_ORIGIN: https://localhost:${E2E_TLS_PORT:-8443}
      APPS_DOMAIN: apps.localhost:${E2E_TLS_PORT:-8443}
      APPS_URL_SCHEME: https
      # Behind Caddy: only its X-Real-IP (the TCP peer) identifies the client.
      TRUST_PROXY: x-real-ip
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_SECURE: '0'
      EMAIL_FROM: no-reply@drobek.app
      # The same RELAXED / LOW test limits as the dev compose (docker-compose.yml)
      # — the specs trip or avoid them on purpose.
      OTP_IP_SHORT_LIMIT: '300'
      OTP_IP_DAILY_LIMIT: '500'
      OTP_EMAIL_HOURLY_LIMIT: '50'
      OTP_EMAIL_COOLDOWN_MS: '5000'
      OTP_GLOBAL_HOURLY_MAX: '1000'
      # Every e2e request reaches drobek from Caddy's one peer IP.
      OTP_VERIFY_IP_LIMIT: '500'
      DATA_MAX_DOCS_PER_APP: '5'
      BEACON_RATE_LIMIT: '30'
      SYNC_PAUSE_AFTER_FAILURES: '2'
      # drobek-module-acme-crm and the operator-only fixture drobek-module-ops-probe
      # are installed into modules_data by scripts/e2e-image.sh. The fixture's
      # error reporter sends to proxy-echo; mail stays on the built-in SMTP.
      DROBEK_MODULES: hello,auth,email,forms,data,proxy,files,sync,oidc,drobek-module-acme-crm,drobek-module-ops-probe
      ERROR_REPORTER: capture
      OPSPROBE_URL: http://proxy-echo:8099/opsprobe
      FILES_MAX_BYTES: '10485760'
      FILES_QUOTA_PER_APP: '2097152'
      HELLO_WAVES_PER_MINUTE: '5'
      AUTH_CODES_PER_IP_15MIN: '300'
      AUTH_CODES_PER_IP_DAY: '500'
      AUTH_CODES_PER_EMAIL_HOUR: '50'
      AUTH_ATTEMPTS_PER_IP_15MIN: '500'
      EMAIL_PER_APP_PER_DAY: '50'
      EMAIL_NOTIFY_ADMINS_PER_DAY: '20'
      EMAIL_GLOBAL_HOURLY_MAX: '1000'
      EMAIL_GLOBAL_PAUSE_MINUTES: '15'
      EMAIL_SIGNIN_HOURLY_MAX: '200'
      EMAIL_APP_HOURLY_SHARE: '25'
      FORMS_SUBMITS_PER_IP_HOUR: '10'
      FORMS_PER_APP_PER_DAY: '200'
      # The abuse spec signs in as this super-admin.
      SUPERADMIN_EMAIL: e2e-superadmin@drobek.test
      ABUSE_REPORTS_PER_IP_HOUR: '5'
      GALLERY_ENABLED: 'true'
      GALLERY_FRAME_ANCESTORS: https://gallery.example.test
      # Google OIDC → the mock the auth-google spec spawns on the host (:3049).
      GOOGLE_CLIENT_ID: local-dev-client
      GOOGLE_CLIENT_SECRET: local-dev-secret
      GOOGLE_AUTH_URL: http://localhost:3049/authorize
      GOOGLE_TOKEN_URL: http://host.docker.internal:3049/token
      GOOGLE_USERINFO_URL: http://host.docker.internal:3049/userinfo
      # The BFF proxy may reach the in-network echo target.
      PROXY_ALLOWED_HOSTS: proxy-echo
      # Deliberately set: production must IGNORE it (mcp-cimd.spec asserts the refusal).
      OAUTH_CIMD_DEV_ORIGINS: http://proxy-echo:8099
      LIMITS_PROVIDER_URL: http://proxy-echo:8099
      LIMITS_PROVIDER_SECRET: ${LIMITS_PROVIDER_SECRET:?generated by scripts/e2e-image.sh}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - /data/files
      - /data/assets
      # A named volume, so a module can be installed into it before the stack starts.
      - modules_data:/data/modules
    # The image's own HEALTHCHECK probes /healthz (db + redis) — `up --wait` uses it.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      proxy-echo:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    ports:
      - '127.0.0.1:${E2E_TLS_PORT:-8443}:${E2E_TLS_PORT:-8443}'
    environment:
      TLS_ASK_TOKEN: ${TLS_ASK_TOKEN:?generated by scripts/e2e-image.sh}
    volumes:
      # Rendered by the image's own caddy-config CLI (scripts/e2e-image.sh).
      - ./.caddy/Caddyfile.e2e:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ['CMD-SHELL', 'nc -z -w 3 127.0.0.1 ${E2E_TLS_PORT:-8443} || exit 1']
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      drobek:
        condition: service_healthy

volumes:
  modules_data:
