# drobek — local dev stack (M0): web + mcp + postgres + redis. No worker yet
# (the BullMQ worker joins the deploy compose with U6). Ports 3041/3042 are
# drobek's; postgres/redis publish on non-default host ports to avoid
# colliding with other local stacks.
#
# Bind-mounts + anonymous volumes on every node_modules dir: the host (macOS)
# installs must never clobber the container's (linux) pnpm symlinks/binaries.
services:
  postgres:
    image: postgres:17-alpine
    container_name: drobek-postgres
    environment:
      POSTGRES_USER: drobek
      POSTGRES_PASSWORD: drobek
      POSTGRES_DB: drobek
    ports:
      - '${POSTGRES_PUBLISH:-5441}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U drobek -d drobek']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: drobek-redis
    ports:
      - '${REDIS_PUBLISH:-6391}:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    # U2: local SMTP sink — web sends login codes to mailpit:1025 (in-network,
    # no host publish needed); the web UI + REST API publish to the host for
    # e2e polling (tests-e2e/tests/auth-flow.spec.ts) and manual inspection.
    image: axllent/mailpit
    container_name: drobek-mailpit
    ports:
      - '${MAILPIT_PUBLISH:-8025}:8025'
    healthcheck:
      # Verified: the image ships /mailpit with a `readyz` probe subcommand
      # (hits the /readyz endpoint on 8025 internally).
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: drobek-web
    working_dir: /repo/apps/web
    ports:
      - '${WEB_PUBLISH:-3041}:${WEB_PORT:-3000}'
    environment:
      DATABASE_URL: postgresql://drobek:drobek@postgres:5432/drobek
      REDIS_URL: redis://redis:6379
      PORT: '${WEB_PORT:-3000}'
      NODE_ENV: development
      GIT_SHA: ${GIT_SHA:-dev}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      # D2/PHY-96: content-hash blob files live on the persistent volume.
      BLOB_DIR: /data/blobs
      # PHY-100: HMAC secret for signed upload tokens — required, no default.
      UPLOAD_SIGNING_SECRET: ${UPLOAD_SIGNING_SECRET:?UPLOAD_SIGNING_SECRET must be set in .env (see .env.example)}
      # U2: login-code e-mails go to the in-network mailpit sink (no auth).
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_SECURE: '0'
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@drobek.app}
      # U2: OTP guard — env kill switch + tunable limits. Dev values are
      # RELAXED so local e2e and browser verification never trip them
      # (prod defaults, used when unset: 5 / 20 / 3 / 60000 / 100).
      OTP_LOGIN_DISABLED: ${OTP_LOGIN_DISABLED:-}
      OTP_IP_SHORT_LIMIT: ${OTP_IP_SHORT_LIMIT:-100}
      OTP_IP_DAILY_LIMIT: ${OTP_IP_DAILY_LIMIT:-500}
      OTP_EMAIL_HOURLY_LIMIT: ${OTP_EMAIL_HOURLY_LIMIT:-50}
      OTP_EMAIL_COOLDOWN_MS: ${OTP_EMAIL_COOLDOWN_MS:-5000}
      OTP_GLOBAL_HOURLY_MAX: ${OTP_GLOBAL_HOURLY_MAX:-1000}
      # U3: Google OIDC login — dev defaults point at the LOCAL MOCK provider
      # (tests-e2e/mock-google.mjs / `task mock:google`, host port 3049) with
      # dummy credentials. Empty GOOGLE_CLIENT_ID disables the feature.
      # URL split (see .env.example): AUTHORIZE is opened by the BROWSER on the
      # host → localhost:3049; TOKEN + USERINFO are fetched by THIS CONTAINER →
      # host.docker.internal:3049.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-dev-client}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-local-dev-secret}
      GOOGLE_AUTH_URL: ${GOOGLE_AUTH_URL:-http://localhost:3049/authorize}
      GOOGLE_TOKEN_URL: ${GOOGLE_TOKEN_URL:-http://host.docker.internal:3049/token}
      GOOGLE_USERINFO_URL: ${GOOGLE_USERINFO_URL:-http://host.docker.internal:3049/userinfo}
      # Origin the OAuth redirect_uri is built from (PUBLIC_ORIGIN + /auth/google/callback).
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3041}
      # U5 (PHY-71): the OAuth 2.1 Authorization Server issuer advertised in
      # /.well-known/oauth-authorization-server (falls back to PUBLIC_ORIGIN).
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3041}
      # U10 (PHY-55): Data API storage quota + write rate-limit (enforced by the
      # REST data endpoints). DOCS_PER_APP is a deliberately LOW dev cap so the
      # data-api e2e quota case can exceed it quickly (prod defaults are far
      # higher — see .env.example).
      DATA_MAX_DOCS_PER_APP: ${DATA_MAX_DOCS_PER_APP:-5}
      DATA_MAX_DOC_BYTES: ${DATA_MAX_DOC_BYTES:-102400}
      DATA_MAX_BYTES_PER_APP: ${DATA_MAX_BYTES_PER_APP:-52428800}
      DATA_WRITE_RATE_LIMIT: ${DATA_WRITE_RATE_LIMIT:-120}
      DATA_WRITE_RATE_WINDOW_MS: ${DATA_WRITE_RATE_WINDOW_MS:-60000}
      # PHY-123 (agent loop v1): the PUBLIC error beacon. The per-app+IP rate
      # limit is a deliberately LOW dev cap so the beacon-flood e2e trips 429
      # quickly (prod default is 60). BEACON_APP_RATE_LIMIT is a second,
      # IP-INDEPENDENT per-app cap so an attacker rotating X-Forwarded-For cannot
      # dodge the per-IP bucket. Ring-buffer retention: newest 500 / 14 days.
      BEACON_RATE_LIMIT: ${BEACON_RATE_LIMIT:-30}
      BEACON_APP_RATE_LIMIT: ${BEACON_APP_RATE_LIMIT:-600}
      BEACON_RATE_WINDOW_MS: ${BEACON_RATE_WINDOW_MS:-60000}
      BEACON_MAX_EVENTS_PER_APP: ${BEACON_MAX_EVENTS_PER_APP:-500}
      BEACON_RETENTION_DAYS: ${BEACON_RETENTION_DAYS:-14}
      BEACON_SAMPLE_RATE: ${BEACON_SAMPLE_RATE:-1}
    extra_hosts:
      # linux portability: make host.docker.internal resolve everywhere
      # (Docker Desktop has it natively; host-gateway covers linux engines).
      - 'host.docker.internal:host-gateway'
    volumes:
      - .:/repo
      # D2: persistent blob volume (survives container rebuilds; the deploy
      # compose mounts the same-named volume into web+worker+mcp, P0-E).
      - drobek_blobs:/data/blobs
      # Anonymous volumes: keep container-installed deps out of the host tree
      # (and host-installed darwin binaries out of the container).
      - /repo/node_modules
      - /repo/apps/web/node_modules
      - /repo/apps/mcp-server/node_modules
      - /repo/packages/db/node_modules
      - /repo/packages/core/node_modules
      - /repo/packages/insights/node_modules
      - /repo/packages/deploy/node_modules
      - /repo/packages/data/node_modules
      - /repo/packages/agent-dx/node_modules
      - /repo/packages/sdk/node_modules
      - /repo/tests-e2e/node_modules
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -T 5 -O - "http://127.0.0.1:$${PORT:-3000}/healthz" || exit 1']
      interval: 5s
      timeout: 10s
      retries: 90
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  mcp:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    container_name: drobek-mcp
    working_dir: /repo/apps/mcp-server
    ports:
      - '${MCP_PUBLISH:-3042}:${MCP_PORT:-3001}'
    environment:
      PORT: '${MCP_PORT:-3001}'
      NODE_ENV: development
      DATABASE_URL: postgresql://drobek:drobek@postgres:5432/drobek
      REDIS_URL: redis://redis:6379
      GIT_SHA: ${GIT_SHA:-dev}
      # D2: mcp shares the blob volume (deploy tooling reads blobs later).
      BLOB_DIR: /data/blobs
      # U5 (PHY-71): OAuth 2.1 Resource Server wiring. PUBLIC_MCP_URL is this
      # server's canonical resource identifier (== the required token audience);
      # PUBLIC_APP_URL is the drobek Authorization Server issuer advertised in
      # the protected-resource metadata.
      PUBLIC_MCP_URL: ${PUBLIC_MCP_URL:-http://localhost:3042}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3041}
      # Global super-admin override for the per-tool-call membership re-check.
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      # U6 (PHY-57): deploy_init mints signed upload tokens (needs the same
      # HMAC secret as the web upload sink) and enforces the deploy quota.
      UPLOAD_SIGNING_SECRET: ${UPLOAD_SIGNING_SECRET:?UPLOAD_SIGNING_SECRET must be set in .env (see .env.example)}
      DEPLOY_MAX_APP_BYTES: ${DEPLOY_MAX_APP_BYTES:-104857600}
      DEPLOY_MAX_FILE_BYTES: ${DEPLOY_MAX_FILE_BYTES:-10485760}
      # U10 (PHY-55): the MCP data tools (collection_define / record_*) enforce
      # the same Data API quota + write rate-limit as the REST endpoints. Keep
      # these in lock-step with the web service (low dev DOCS_PER_APP cap).
      DATA_MAX_DOCS_PER_APP: ${DATA_MAX_DOCS_PER_APP:-5}
      DATA_MAX_DOC_BYTES: ${DATA_MAX_DOC_BYTES:-102400}
      DATA_MAX_BYTES_PER_APP: ${DATA_MAX_BYTES_PER_APP:-52428800}
      DATA_WRITE_RATE_LIMIT: ${DATA_WRITE_RATE_LIMIT:-120}
      DATA_WRITE_RATE_WINDOW_MS: ${DATA_WRITE_RATE_WINDOW_MS:-60000}
    volumes:
      - .:/repo
      - drobek_blobs:/data/blobs
      - /repo/node_modules
      - /repo/apps/web/node_modules
      - /repo/apps/mcp-server/node_modules
      - /repo/packages/db/node_modules
      - /repo/packages/core/node_modules
      - /repo/packages/insights/node_modules
      - /repo/packages/deploy/node_modules
      - /repo/packages/data/node_modules
      - /repo/packages/agent-dx/node_modules
      - /repo/packages/sdk/node_modules
      - /repo/tests-e2e/node_modules
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -T 5 -O - "http://127.0.0.1:$${PORT:-3001}/health" || exit 1']
      interval: 5s
      timeout: 10s
      retries: 45
      start_period: 20s
    depends_on:
      # web runs `pnpm install` + package builds + migrations into the shared
      # bind mount first; serializing avoids two containers compiling
      # packages/*/dist concurrently.
      web:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    # U6 (PHY-57): the BullMQ deploy consumer. Ships INSIDE the web image
    # (apps/web/scripts/worker.mjs) — NO separate app — and shares the DB, redis
    # and the drobek_blobs volume with web+mcp. Queue "deploys", prefix "drobek"
    # (shared-redis isolation from puls). No published port, no HTTP healthcheck
    # (a pgrep running-check). The web image ENTRYPOINT builds packages +
    # migrates first, then execs the command below.
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: drobek-worker
    working_dir: /repo/apps/web
    command: ['node', 'scripts/worker.mjs']
    environment:
      DATABASE_URL: postgresql://drobek:drobek@postgres:5432/drobek
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      GIT_SHA: ${GIT_SHA:-dev}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      # D2: same blob volume the sink writes to — the worker reads bytes for lint.
      BLOB_DIR: /data/blobs
      # U6: PUBLIC_APP_URL is used to build the activated app URL in progress.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3041}
      # U6: quota mirrors the mcp service (dev-generous defaults).
      DEPLOY_MAX_APP_BYTES: ${DEPLOY_MAX_APP_BYTES:-104857600}
      DEPLOY_MAX_FILE_BYTES: ${DEPLOY_MAX_FILE_BYTES:-10485760}
    volumes:
      - .:/repo
      - drobek_blobs:/data/blobs
      - /repo/node_modules
      - /repo/apps/web/node_modules
      - /repo/apps/mcp-server/node_modules
      - /repo/packages/db/node_modules
      - /repo/packages/core/node_modules
      - /repo/packages/insights/node_modules
      - /repo/packages/deploy/node_modules
      - /repo/packages/data/node_modules
      - /repo/packages/agent-dx/node_modules
      - /repo/packages/sdk/node_modules
      - /repo/tests-e2e/node_modules
    healthcheck:
      # No HTTP surface — assert the consumer process is alive (busybox pgrep).
      test: ['CMD-SHELL', 'pgrep -f scripts/worker.mjs > /dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      # Serialize behind web (shared bind-mount build) + require datastores.
      web:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  # D2 (ratified): persistent content-hash blob store — /data/blobs/<ab>/<sha256>.
  # Without this volume every rebuild would wipe deployed apps (PHY-96).
  drobek_blobs:
