# drobek — local dev stack (M0): web + mcp + postgres + redis. No worker yet
# (the BullMQ worker joins the deploy compose with U6). Ports 3041/3042 are
# drobek's; postgres/redis publish on non-default host ports to avoid
# colliding with other local stacks.
#
# Bind-mounts + anonymous volumes on every node_modules dir: the host (macOS)
# installs must never clobber the container's (linux) pnpm symlinks/binaries.
services:
  postgres:
    image: postgres:17-alpine
    container_name: drobek-postgres
    environment:
      POSTGRES_USER: drobek
      POSTGRES_PASSWORD: drobek
      POSTGRES_DB: drobek
    ports:
      - '${POSTGRES_PUBLISH:-5441}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U drobek -d drobek']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: drobek-redis
    ports:
      - '${REDIS_PUBLISH:-6391}:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    # U2: local SMTP sink — web sends login codes to mailpit:1025 (in-network,
    # no host publish needed); the web UI + REST API publish to the host for
    # e2e polling (tests-e2e/tests/auth-flow.spec.ts) and manual inspection.
    image: axllent/mailpit
    container_name: drobek-mailpit
    ports:
      - '${MAILPIT_PUBLISH:-8025}:8025'
    healthcheck:
      # Verified: the image ships /mailpit with a `readyz` probe subcommand
      # (hits the /readyz endpoint on 8025 internally).
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: drobek-web
    working_dir: /repo/apps/web
    ports:
      - '${WEB_PUBLISH:-3041}:${WEB_PORT:-3000}'
    environment:
      DATABASE_URL: postgresql://drobek:drobek@postgres:5432/drobek
      REDIS_URL: redis://redis:6379
      PORT: '${WEB_PORT:-3000}'
      NODE_ENV: development
      GIT_SHA: ${GIT_SHA:-dev}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      # D2/PHY-96: content-hash blob files live on the persistent volume.
      BLOB_DIR: /data/blobs
      # PHY-100: HMAC secret for signed upload tokens — required, no default.
      UPLOAD_SIGNING_SECRET: ${UPLOAD_SIGNING_SECRET:?UPLOAD_SIGNING_SECRET must be set in .env (see .env.example)}
      # U2: login-code e-mails go to the in-network mailpit sink (no auth).
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_SECURE: '0'
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@drobek.app}
      # U2: OTP guard — env kill switch + tunable limits. Dev values are
      # RELAXED so local e2e and browser verification never trip them
      # (prod defaults, used when unset: 5 / 20 / 3 / 60000 / 100).
      OTP_LOGIN_DISABLED: ${OTP_LOGIN_DISABLED:-}
      OTP_IP_SHORT_LIMIT: ${OTP_IP_SHORT_LIMIT:-100}
      OTP_IP_DAILY_LIMIT: ${OTP_IP_DAILY_LIMIT:-500}
      OTP_EMAIL_HOURLY_LIMIT: ${OTP_EMAIL_HOURLY_LIMIT:-50}
      OTP_EMAIL_COOLDOWN_MS: ${OTP_EMAIL_COOLDOWN_MS:-5000}
      OTP_GLOBAL_HOURLY_MAX: ${OTP_GLOBAL_HOURLY_MAX:-1000}
    volumes:
      - .:/repo
      # D2: persistent blob volume (survives container rebuilds; the deploy
      # compose mounts the same-named volume into web+worker+mcp, P0-E).
      - drobek_blobs:/data/blobs
      # Anonymous volumes: keep container-installed deps out of the host tree
      # (and host-installed darwin binaries out of the container).
      - /repo/node_modules
      - /repo/apps/web/node_modules
      - /repo/apps/mcp-server/node_modules
      - /repo/packages/db/node_modules
      - /repo/packages/core/node_modules
      - /repo/packages/sdk/node_modules
      - /repo/tests-e2e/node_modules
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -T 5 -O - "http://127.0.0.1:$${PORT:-3000}/healthz" || exit 1']
      interval: 5s
      timeout: 10s
      retries: 90
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  mcp:
    build:
      context: .
      dockerfile: apps/mcp-server/Dockerfile
    container_name: drobek-mcp
    working_dir: /repo/apps/mcp-server
    ports:
      - '${MCP_PUBLISH:-3042}:${MCP_PORT:-3001}'
    environment:
      PORT: '${MCP_PORT:-3001}'
      NODE_ENV: development
      DATABASE_URL: postgresql://drobek:drobek@postgres:5432/drobek
      REDIS_URL: redis://redis:6379
      GIT_SHA: ${GIT_SHA:-dev}
      # D2: mcp shares the blob volume (deploy tooling reads blobs later).
      BLOB_DIR: /data/blobs
    volumes:
      - .:/repo
      - drobek_blobs:/data/blobs
      - /repo/node_modules
      - /repo/apps/web/node_modules
      - /repo/apps/mcp-server/node_modules
      - /repo/packages/db/node_modules
      - /repo/packages/core/node_modules
      - /repo/packages/sdk/node_modules
      - /repo/tests-e2e/node_modules
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -T 5 -O - "http://127.0.0.1:$${PORT:-3001}/health" || exit 1']
      interval: 5s
      timeout: 10s
      retries: 45
      start_period: 20s
    depends_on:
      # web runs `pnpm install` + package builds + migrations into the shared
      # bind mount first; serializing avoids two containers compiling
      # packages/*/dist concurrently.
      web:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  # D2 (ratified): persistent content-hash blob store — /data/blobs/<ab>/<sha256>.
  # Without this volume every rebuild would wipe deployed apps (PHY-96).
  drobek_blobs:
