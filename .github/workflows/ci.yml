# drobek (PUBLIC core) — CI (M0-08)
#
#   quality  doc-lint → lint → typecheck → unit tests (the `task check` pieces)
#   e2e      build the production image ONCE (Dockerfile `runner`) → run it
#            with docker-compose.e2e.yaml behind Caddy (tls internal) with
#            throwaway postgres / redis / mailpit / proxy-echo → the server
#            migrates the fresh DB on start → /healthz → Playwright @smoke +
#            @local (guarded TRUNCATE, host allow-list) — scripts/e2e-image.sh,
#            the same script `task e2e:image` runs locally.
#            The exact image that passed is pushed to GHCR:
#              main       ghcr.io/freema/drobek:{<sha>,edge}
#              tag vX.Y.Z ghcr.io/freema/drobek:{<sha>,vX.Y.Z}
#   release  (tags vX.Y.Z only, M4-03) no rebuild — registry-side retags of the
#            image the e2e job pushed: the former `latest` → `previous` (the
#            rollback target), vX.Y.Z → `latest`. A pre-release tag
#            (vX.Y.Z-rc.1) gets its own tag only, never `latest`.
#
# Images are linux/amd64 only (no ARM image in v1). A release image is built
# from the tag with GIT_SHA = the tag's commit and VERSION = the tag, both
# visible in /api/version; `git checkout vX.Y.Z && task build` rebuilds it
# from the same sources and lockfile.
#
# Triggers: pushes to `next` and `main` and `v*` tags only (Actions capacity is
# limited — `next` is pushed at milestone end; no PR / schedule triggers). A
# newer push to the same ref cancels the running one.
#
# No repository secrets are used except the automatic GITHUB_TOKEN (GHCR push
# on main and tags). The e2e stack's DROBEK_MASTER_KEY / TLS_ASK_TOKEN are
# generated per run by scripts/e2e-image.sh.
#
# The GHCR package must be PUBLIC so `docker compose pull` works without auth:
# a ONE-TIME operator action after the first publish (package → settings).
name: CI

on:
  push:
    branches: [main, next]
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 10.33.2
  NODE_VERSION: '22'
  IMAGE: ghcr.io/freema/drobek

jobs:
  quality:
    name: Lint · typecheck · unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Doc-lint (retired vocabulary, quickstart parity, env reference)
        run: pnpm doc-lint

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  e2e:
    name: Prod image · compose · e2e (@smoke + @local)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # only used by the main-branch / tag push steps below
    outputs:
      version: ${{ steps.sha.outputs.version }}
      prerelease: ${{ steps.sha.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve git short sha + release version
        id: sha
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = tag ]; then
            # Semver release tags only: vX.Y.Z or vX.Y.Z-<pre-release>.
            if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::tag $REF_NAME is not a release tag (vX.Y.Z[-pre])"; exit 1
            fi
            echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
            case "$REF_NAME" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install the e2e package only
        run: pnpm install --frozen-lockfile --filter tests-e2e

      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(pnpm -C tests-e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Chromium + system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm -C tests-e2e exec playwright install --with-deps chromium

      - name: Install Chromium system deps (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm -C tests-e2e exec playwright install-deps chromium

      - uses: docker/setup-buildx-action@v3

      - name: Build the production image (runner target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runner
          # Into the local daemon: compose runs it, and on main / a tag this
          # exact image is pushed. amd64 only (v1: no ARM image).
          platforms: linux/amd64
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
            VERSION=${{ steps.sha.outputs.version }}
          cache-from: type=gha,scope=drobek
          cache-to: type=gha,scope=drobek,mode=max
          provenance: false
          sbom: false

      - name: e2e against the image (compose up → migrate → @smoke + @local)
        env:
          DROBEK_IMAGE: ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
        run: ./scripts/e2e-image.sh

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ steps.sha.outputs.short }}
          path: |
            tests-e2e/playwright-report
            tests-e2e/test-results
          retention-days: 7

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image (main → edge)
        if: github.ref == 'refs/heads/main'
        env:
          SHA: ${{ steps.sha.outputs.short }}
        run: |
          docker tag "$IMAGE:$SHA" "$IMAGE:edge"
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:edge"

      - name: Push the tested image (tag → vX.Y.Z)
        if: github.ref_type == 'tag'
        env:
          SHA: ${{ steps.sha.outputs.short }}
          VERSION: ${{ steps.sha.outputs.version }}
        run: |
          docker tag "$IMAGE:$SHA" "$IMAGE:$VERSION"
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:$VERSION"

  release:
    name: Release tags (latest, previous)
    runs-on: ubuntu-latest
    needs: e2e
    if: github.ref_type == 'tag' && needs.e2e.outputs.prerelease != 'true'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry-side retags (no pull, no rebuild): the image the e2e job
      # tested and pushed as vX.Y.Z becomes `latest`; the image `latest`
      # pointed at before becomes `previous`. Re-running the job for the same
      # tag keeps `previous` (it never points at the release itself).
      - name: previous ← latest, latest ← vX.Y.Z
        env:
          VERSION: ${{ needs.e2e.outputs.version }}
        run: |
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty'; }
          new="$(digest "$IMAGE:$VERSION")"
          [ -n "$new" ] || { echo "::error::$IMAGE:$VERSION not found"; exit 1; }
          old="$(digest "$IMAGE:latest" || true)"
          if [ -n "$old" ] && [ "$old" != "$new" ]; then
            docker buildx imagetools create -t "$IMAGE:previous" "$IMAGE@$old"
            echo "previous → $old"
          else
            echo "previous unchanged (no former latest, or it is this release)"
          fi
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$new"
          echo "latest → $VERSION ($new)"
