# drobek (PUBLIC core) — CI
#
#   quality  doc-lint → lint → typecheck → knip (the `task check` pieces)
#   unit     the unit tests, a job of their own so both stay within 10 minutes
#   module-compatibility  (module-compatibility.yml) the pinned external
#            drobek-module-counter typechecked, built, tested, packed and
#            loaded against this checkout's packed public packages
#            (scripts/check-external-module.mjs).
#   image    build the production image ONCE (Dockerfile `runner`) and hand
#            it to e2e as a docker-load artifact (kept for a day).
#   e2e      (after image) load that image → run it
#            with docker-compose.e2e.yaml behind Caddy (tls internal) with
#            throwaway postgres / redis / mailpit and the e2e helpers
#            (proxy-echo, oidc-mock, dns-mock) → the server migrates the fresh
#            DB on start → /healthz → Playwright @smoke + @local (guarded
#            TRUNCATE, host allow-list) → drobek recreated with
#            EMAIL_TRANSPORT=relay + PUBLISH_APPROVAL=approval for the specs
#            that need it → the skip guard (every test ran in a phase) —
#            scripts/e2e-image.sh, the same script `task e2e:image` runs
#            locally. The image that
#            passed is pushed as ghcr.io/freema/drobek:<sha> (main) or
#            :<sha>-vX.Y.Z (tags): a tag and main on the same commit build
#            different VERSIONs and must not overwrite each other.
#   quality, unit, module-compatibility and image → e2e run in parallel.
#   The release gate — three more jobs, on tags only (skipped on main):
#   audit    `pnpm audit --prod --audit-level high` over the lockfile: an
#            advisory of high or critical severity in a production
#            dependency fails it.
#   scan     (after image) the image tarball the e2e job tests, scanned for
#            known vulnerabilities in its OS and Node packages by a scanner
#            image pinned by digest, in a job without secrets or write
#            permissions: a high or critical vulnerability that has a fixed
#            version fails it.
#   rehearsal (after e2e, selfhost-rehearsal.yml) the image e2e pushed as
#            <sha>-vX.Y.Z, pulled like a VPS does: the docs/SELF-HOSTING.md
#            quickstart, `task backup` and a restore on a second machine.
#   promote  (main and tags, after quality, unit, module-compatibility and e2e
#            pass; a tag also needs audit, scan and rehearsal) no rebuild —
#            registry-side tags of the image the e2e job tested and pushed:
#              main       edge
#              tag vX.Y.Z vX.Y.Z; the former `latest` → `previous` (the
#                         rollback target), vX.Y.Z → `latest`. A pre-release
#                         tag (vX.Y.Z-rc.1) gets its own tag only.
#   npm      (tags only, and only while the repository variable NPM_PUBLISH
#            is `true`) publishes @freema/drobek-sdk,
#            @freema/drobek-modules (the workspace @drobek/sdk and
#            @drobek/modules; module code imports them under those names via
#            npm aliases) and create-drobek-module at the tag's version (a
#            pre-release under the dist-tag `next`) with npm Trusted
#            Publishing — OIDC, no token, provenance attached — skipping a
#            version npm already has (scripts/npm-packages.mjs publish). After
#            promote, so only a tag that passed the release gate publishes.
#   release  (tags only, after promote) the GitHub Release for the tag, its
#            notes = the tag's CHANGELOG section plus the image name; a
#            pre-release tag is marked pre-release, otherwise it is Latest.
#            An existing release is left alone.
#   registry (tags only, after promote) publishes the hosted Streamable HTTP
#            endpoint from server.json to the official MCP Registry through
#            GitHub OIDC. The release tag supplies the registry version.
#
# Images are linux/amd64 only (no ARM image in v1). A release image is built
# from the tag with GIT_SHA = the tag's commit, VERSION = the tag and
# COMMIT_TIME = that commit's time, all visible in /api/version; `git checkout vX.Y.Z && task build` rebuilds it
# from the same sources and lockfile.
#
# Triggers: pushes to `main` and `v*` tags only (Actions capacity is limited —
# push what `task check` proved; no schedule trigger). audit, scan and
# rehearsal run on tags only. Pull requests run the
# `quality` job alone, from pr.yml. A newer push to
# the same ref cancels the running one.
#
# No repository secrets are used except the automatic GITHUB_TOKEN (GHCR push
# on main and tags). The e2e stack's DROBEK_MASTER_KEY / TLS_ASK_TOKEN are
# generated per run by scripts/e2e-image.sh.
#
# The GHCR package must be PUBLIC so `docker compose pull` works without auth:
# a ONE-TIME operator action after the first publish (package → settings).
#
# npm, ONE-TIME (before setting NPM_PUBLISH): the packages live under the npm
# user `freema` (no organisation). Publish each once by hand, logged in as
# freema (`npm login`), from a checkout of a release tag — `pnpm install &&
# pnpm build:packages && node scripts/npm-packages.mjs stage --version
# X.Y.Z`, then `npm publish dist-npm/drobek-sdk --access public`, the same
# for dist-npm/drobek-modules and dist-npm/create-drobek-module; on
# npmjs.com, for each of @freema/drobek-sdk, @freema/drobek-modules and
# create-drobek-module, Settings → Trusted Publisher → GitHub Actions:
# repository `freema/drobek`, workflow `ci.yml` (no environment); then set
# the repository variable NPM_PUBLISH=true (Settings → Secrets and variables
# → Actions → Variables). Without the variable the npm job is skipped.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 10.33.2
  NODE_VERSION: '22'
  IMAGE: ghcr.io/freema/drobek

jobs:
  quality:
    name: Lint · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Doc-lint (retired vocabulary, quickstart parity, env reference)
        run: pnpm doc-lint

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Knip (unused files, exports, dependencies)
        run: pnpm knip

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Unit tests
        run: pnpm test

  module-compatibility:
    name: External consumer
    uses: ./.github/workflows/module-compatibility.yml

  image:
    name: Prod image build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      short: ${{ steps.sha.outputs.short }}
      stage: ${{ steps.sha.outputs.stage }}
      version: ${{ steps.sha.outputs.version }}
      prerelease: ${{ steps.sha.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve git short sha + release version
        id: sha
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          short="$(git rev-parse --short HEAD)"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "commit_time=$(git log -1 --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = tag ]; then
            # Semver release tags only: vX.Y.Z or vX.Y.Z-<pre-release>.
            if ! printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "::error::tag $REF_NAME is not a release tag (vX.Y.Z[-pre])"; exit 1
            fi
            echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "stage=$short-$REF_NAME" >> "$GITHUB_OUTPUT"
            case "$REF_NAME" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          else
            echo "version=dev" >> "$GITHUB_OUTPUT"
            echo "stage=$short" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Build the production image (runner target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runner
          # A docker-load tarball for the e2e job, which tests it and on main /
          # a tag pushes this exact image. amd64 only (v1: no ARM image).
          platforms: linux/amd64
          outputs: type=docker,dest=${{ runner.temp }}/drobek-image.tar
          tags: |
            ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
            VERSION=${{ steps.sha.outputs.version }}
            COMMIT_TIME=${{ steps.sha.outputs.commit_time }}
          cache-from: type=gha,scope=drobek
          cache-to: type=gha,scope=drobek,mode=max
          provenance: false
          sbom: false

      - name: Upload the image for the e2e job
        uses: actions/upload-artifact@v4
        with:
          name: drobek-image-${{ steps.sha.outputs.short }}
          path: ${{ runner.temp }}/drobek-image.tar
          compression-level: 1
          retention-days: 1

  e2e:
    name: Prod image · compose · e2e (@smoke + @local)
    runs-on: ubuntu-latest
    needs: image
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write # only used by the main-branch / tag push step below
    outputs:
      stage: ${{ needs.image.outputs.stage }}
      version: ${{ needs.image.outputs.version }}
      prerelease: ${{ needs.image.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install the e2e package and the example module scripts/e2e-image.sh packs
        run: pnpm install --frozen-lockfile --filter tests-e2e --filter "drobek-module-acme-crm..."

      - name: Build the example module and the packages it compiles against
        run: pnpm --filter "drobek-module-acme-crm..." build

      - name: Resolve the Playwright version
        id: pw
        run: echo "version=$(pnpm -C tests-e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium

      - name: Install Chromium + system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm -C tests-e2e exec playwright install --with-deps chromium

      - name: Install Chromium system deps (browser cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm -C tests-e2e exec playwright install-deps chromium

      - name: Download the image the image job built
        uses: actions/download-artifact@v4
        with:
          name: drobek-image-${{ needs.image.outputs.short }}
          path: ${{ runner.temp }}

      - name: Load the image into the local daemon
        run: docker load --input "$RUNNER_TEMP/drobek-image.tar"

      - name: e2e against the image (compose up → migrate → @smoke + @local → relay + approval → skip guard)
        env:
          DROBEK_IMAGE: ${{ env.IMAGE }}:${{ needs.image.outputs.short }}
        run: ./scripts/e2e-image.sh

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ needs.image.outputs.short }}
          path: |
            tests-e2e/playwright-report
            tests-e2e/test-results
          retention-days: 7

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image (<sha> | <sha>-vX.Y.Z)
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        env:
          SHA: ${{ needs.image.outputs.short }}
          STAGE: ${{ needs.image.outputs.stage }}
        run: |
          [ "$STAGE" = "$SHA" ] || docker tag "$IMAGE:$SHA" "$IMAGE:$STAGE"
          docker push "$IMAGE:$STAGE"

  audit:
    name: Release gate · production dependency audit (high)
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Reads pnpm-lock.yaml; no install needed.
      - name: pnpm audit --prod --audit-level high
        run: pnpm audit --prod --audit-level high

  scan:
    name: Release gate · image vulnerability scan (high, fixable)
    runs-on: ubuntu-latest
    needs: image
    if: github.ref_type == 'tag'
    timeout-minutes: 10
    env:
      SCANNER: ghcr.io/aquasecurity/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    steps:
      - name: Download the image the image job built
        uses: actions/download-artifact@v4
        with:
          name: drobek-image-${{ needs.image.outputs.short }}
          path: ${{ runner.temp }}

      - name: Scan the image tarball (OS + Node packages, high and critical with a fix)
        run: |
          docker run --rm -v "$RUNNER_TEMP:/scan:ro" "$SCANNER" image \
            --input /scan/drobek-image.tar --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress

  rehearsal:
    name: Release gate · self-host rehearsal
    needs: e2e
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/selfhost-rehearsal.yml
    with:
      image_tag: ${{ needs.e2e.outputs.stage }}

  promote:
    name: Image tags (edge, vX.Y.Z, latest, previous)
    runs-on: ubuntu-latest
    needs: [quality, unit, module-compatibility, e2e, audit, scan, rehearsal]
    # audit, scan and rehearsal are skipped on main; a tag needs all three.
    if: >-
      !cancelled()
      && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
      && needs.quality.result == 'success'
      && needs.unit.result == 'success'
      && needs.module-compatibility.result == 'success'
      && needs.e2e.result == 'success'
      && (github.ref_type != 'tag' || needs.audit.result == 'success')
      && (github.ref_type != 'tag' || needs.scan.result == 'success')
      && (github.ref_type != 'tag' || needs.rehearsal.result == 'success')
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry-side tags (no pull, no rebuild) of the image the e2e job
      # tested. Re-running the job for the same tag keeps `previous` (it
      # never points at the release itself).
      - name: edge | vX.Y.Z, previous ← latest, latest ← vX.Y.Z
        env:
          STAGE: ${{ needs.e2e.outputs.stage }}
          VERSION: ${{ needs.e2e.outputs.version }}
          PRERELEASE: ${{ needs.e2e.outputs.prerelease }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty'; }
          new="$(digest "$IMAGE:$STAGE")"
          [ -n "$new" ] || { echo "::error::$IMAGE:$STAGE not found"; exit 1; }
          if [ "$REF_TYPE" != tag ]; then
            docker buildx imagetools create -t "$IMAGE:edge" "$IMAGE@$new"
            echo "edge → $STAGE ($new)"
            exit 0
          fi
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE@$new"
          echo "$VERSION → $STAGE ($new)"
          [ "$PRERELEASE" = true ] && exit 0
          old="$(digest "$IMAGE:latest" || true)"
          if [ -n "$old" ] && [ "$old" != "$new" ]; then
            docker buildx imagetools create -t "$IMAGE:previous" "$IMAGE@$old"
            echo "previous → $old"
          else
            echo "previous unchanged (no former latest, or it is this release)"
          fi
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$new"
          echo "latest → $VERSION ($new)"

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [e2e, promote]
    if: github.ref_type == 'tag'
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create the release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.e2e.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists"; exit 0; fi
          {
            printf 'Image: `%s:%s`\n' "$IMAGE" "$TAG"
            awk -v t="$TAG" 'index($0, "## " t " ") == 1 { f = 1; next } f && /^## / { exit } f' CHANGELOG.md
          } > notes.md
          [ "$(wc -l < notes.md)" -gt 1 ] || { echo "::error::CHANGELOG.md has no '## $TAG ' section"; exit 1; }
          if [ "$PRERELEASE" = true ]; then flag=--prerelease; else flag=--latest; fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md $flag

  npm:
    name: npm packages (@freema/drobek-modules, @freema/drobek-sdk, create-drobek-module)
    runs-on: ubuntu-latest
    needs: [e2e, promote]
    if: github.ref_type == 'tag' && vars.NPM_PUBLISH == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1 (Node 22 ships npm 10).
      - name: npm with Trusted Publishing
        run: npm install -g npm@^11.5.1

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Publish (skips a version npm already has)
        env:
          VERSION: ${{ needs.e2e.outputs.version }}
        run: node scripts/npm-packages.mjs publish --version "$VERSION"

  registry:
    name: Official MCP Registry
    runs-on: ubuntu-latest
    needs: [e2e, promote]
    if: github.ref_type == 'tag'
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Use the release version in server.json
        env:
          VERSION: ${{ needs.e2e.outputs.version }}
        run: |
          jq --arg version "${VERSION#v}" '.version = $version' server.json > server.tmp
          mv server.tmp server.json

      - name: Install the official MCP publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" \
            | tar xz mcp-publisher

      - name: Publish server metadata
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
