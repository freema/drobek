# drobek (PUBLIC core) — CI → GHCR (P0-D)
#
# quality: install → build packages → typecheck → lint → unit tests.
# build-push (main only): buildx → ghcr.io/freema/drobek-selfhost-{web,mcp}.
#
# GHCR naming (ROADMAP §2, ratified): the PUBLIC repo must NOT push a package
# named drobek-web — self-host images are drobek-selfhost-{web,mcp} and must be
# PUBLIC visibility so `docker compose up` pulls without auth. New GHCR
# packages are private by default: the visibility flip is a ONE-TIME operator
# action after the first publish (GitHub → package → settings → public), not CI's.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:packages

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  build-push:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: quality
    # Push images from main only; PRs stop at the quality gate.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: drobek-selfhost-web
            dockerfile: apps/web/Dockerfile.prod
            scope: selfhost-web
          - image: drobek-selfhost-mcp
            dockerfile: apps/mcp-server/Dockerfile.prod
            scope: selfhost-mcp
    steps:
      - uses: actions/checkout@v4

      - name: Resolve git short sha
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # runner is the LAST stage (default target) — keep explicit anyway.
          target: runner
          push: true
          tags: |
            ghcr.io/freema/${{ matrix.image }}:latest
            ghcr.io/freema/${{ matrix.image }}:${{ steps.sha.outputs.short }}
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,scope=${{ matrix.scope }},mode=max
          provenance: false
          sbom: false
