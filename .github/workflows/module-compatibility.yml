name: External module compatibility

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  counter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: freema/drobek-module-counter
          # Reviewed source, not a floating branch. Update deliberately with compatibility evidence.
          ref: aee694e595994752fcf681d305643528f457ea2b
          path: .compat-counter
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Test the counter against candidate public packages
        env:
          CORE_RELEASE: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: node scripts/check-external-module.mjs .compat-counter "$CORE_RELEASE"
